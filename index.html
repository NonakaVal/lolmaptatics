<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wild Rift Map Planner — Champions</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Wild Rift</strong><span>Map Planner · Champions</span>
    </div>
    <div class="top-actions">
      <button id="btn-restart" class="btn small" title="Reiniciar quadro (main.json)">Restartar</button>
      <button id="btn-export" class="btn small" title="Exportar quadro (JSON)">Exportar</button>
      <button id="btn-import" class="btn small" title="Importar quadro (JSON)">Importar</button>
      <input id="file-import" type="file" accept="application/json,.json" hidden />
    </div>
    <div class="hint">Arraste p/ mover · Duplo-clique na torre/barão/dragão/personagem marca</div>
  </header>

  <main class="layout">
    <section class="viewport" id="viewport">
      <div class="world" id="world">
        <img id="basemap" class="basemap" src="resources/map-map-icons/mapcanvas.png" alt="Mapa" draggable="false" />
        <div id="layer-structs" class="layer"></div>
        <svg id="layer-arrows" class="layer" viewBox="0 0 1000 725.0755" aria-label="Setas de movimentação">
          <defs><marker id="arrow-tip" viewBox="0 0 16 14" refX="14" refY="7" markerWidth="5" markerHeight="4.375" orient="auto" overflow="visible"><path d="M 1 1 L 14 7 L 1 13 L 4 7 Z" fill="#e8cf87" stroke="#e8cf87" stroke-width="1.2" stroke-linejoin="round" /></marker><marker id="arrow-tip-blue" viewBox="0 0 16 14" refX="14" refY="7" markerWidth="5" markerHeight="4.375" orient="auto" overflow="visible"><path d="M 1 1 L 14 7 L 1 13 L 4 7 Z" fill="#2f9dff" stroke="#2f9dff" stroke-width="1.2" stroke-linejoin="round" /></marker><marker id="arrow-tip-red" viewBox="0 0 16 14" refX="14" refY="7" markerWidth="5" markerHeight="4.375" orient="auto" overflow="visible"><path d="M 1 1 L 14 7 L 1 13 L 4 7 Z" fill="#ff4d5e" stroke="#ff4d5e" stroke-width="1.2" stroke-linejoin="round" /></marker></defs>
          <g id="arrows"></g>
        </svg>
        <div id="layer-wards" class="layer"></div>
        <div id="layer-tokens" class="layer"></div>
      </div>
      <div class="map-zoom" id="map-zoom" role="group" aria-label="Ferramentas e zoom do mapa">
        <button id="tool-arrow" class="btn tool-btn" aria-pressed="false" title="Comece em um personagem ou na ponta de uma seta" aria-describedby="tool-hint"><span aria-hidden="true">↗</span><span>Seta</span></button>
        <button id="tool-ward" class="btn tool-btn" aria-pressed="false" title="Clique no mapa para colocar uma ward" aria-describedby="tool-hint"><img src="resources/champions/ward.png" alt="" /><span>Ward</span></button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button id="zoom-out" class="zoom-btn" title="Afastar (-)">−</button>
        <span class="zoom-label" id="zoom-label">100%</span>
        <button id="zoom-in" class="zoom-btn" title="Aproximar (+)">+</button>
        <button id="zoom-reset" class="zoom-btn" title="Resetar visão (0)">⤾</button>
      </div>
      <p id="tool-hint" class="tool-hint" aria-live="polite"></p>
    </section>

    <aside class="side" aria-label="Personagens">
      <h2>Personagens</h2>
      <div id="roster" class="roster"><p class="muted">Nenhum personagem adicionado.</p></div>
    </aside>
  </main>

  <!-- Modal champions -->
  <div class="modal-backdrop" id="champ-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Escolher champion">
      <div class="modal-head">
        <strong id="champ-modal-title">Trocar champion</strong>
        <button class="btn small" id="champ-close">Fechar ✕</button>
      </div>
      <div class="modal-sub">
        <input id="champ-search" type="search" placeholder="Buscar... ex: ahri, lee" autocomplete="off" />
        <div class="team-pick" role="radiogroup" aria-label="Time">
          <label><input type="radio" name="team" value="blue" checked /> <span class="pill blue">Blue</span></label>
          <label><input type="radio" name="team" value="red" /> <span class="pill red">Red</span></label>
          <label><input type="radio" name="team" value="neutral" /> <span class="pill neutral">Neutro</span></label>
        </div>
      </div>
      <div class="champ-grid" id="champ-grid"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
